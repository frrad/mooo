# Directory holding operator-created Kakao profiles. Each profile consists of
# the private auth-state file named after the profile, plus the ".lock" and
# ".continuity" files the client keeps beside it. The directory must be
# accessible only by the bridge's user (mode 0700).
profile_dir: ./profiles

# Optional research comparison of every incoming LOCO body. Production
# decoding is unchanged; when enabled, a second, source-compatible decoder
# reads the same bytes and any difference in the data callers would see is
# reported. It costs a second decode per packet, so it is off by default.
bson_shadow:
    # off, log or panic. Empty means off. Do not use panic in production: any
    # sender who can trigger a discrepancy could then crash the bridge.
    mode: ""
    # Optional private directory (mode 0700) for raw-body dumps that allow an
    # isolated reproduction. Dumps contain private message content; never
    # commit or share them unsanitized.
    dump_dir: ""
