# Directory holding operator-created Kakao profiles. Each profile consists of
# the private auth-state file named after the profile, plus the ".lock" and
# ".continuity" files the client keeps beside it. The directory must be
# accessible only by the bridge's user (mode 0700).
profile_dir: ./profiles

# Optional research comparison of every incoming LOCO body. Production
# decoding is unchanged; when enabled, a second, source-compatible decoder
# reads the same bytes and any difference in the data callers would see is
# reported. It costs a second decode per packet, so it is off by default.
bson_shadow:
    # off, log or panic. Empty means off. Do not use panic in production: any
    # sender who can trigger a discrepancy could then crash the bridge.
    mode: ""
    # Optional private directory (mode 0700) for raw-body dumps that allow an
    # isolated reproduction. Dumps contain private message content; never
    # commit or share them unsanitized.
    dump_dir: ""

# Optional private directory for debugging. When set, the bridge writes raw
# data here: every message that becomes a "malformed_payload" notice, and every
# media upload reply that fails to decode. The bridge creates the directory
# with mode 0700 if it is missing. Dumps contain private message content and
# upload tokens; never commit or share them unsanitized. Empty, the default,
# is off.
debug_dump_dir: ""

# Optional mxc:// URI of an image to publish as the KakaoTalk network icon.
# It is published as the m.bridge protocol and network avatar_url and used as
# the avatar of the bridge space and management room when they are created;
# the bot's own avatar is appservice.bot.avatar. Beeper Desktop (4.3) shows the
# network avatar as the account's sidebar icon; its chat-list badges come
# from its own built-in icon set and ignore this. Upload an image you are
# entitled to use to your homeserver and paste its mxc:// URI here. Existing
# rooms keep their old icon until the bridge runs once with
# bridge.resend_bridge_info: true.
network_icon: ""
